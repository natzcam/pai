name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Library, worklet and app tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/worklet/package-lock.json
            mobile/app/package-lock.json
      - run: npm ci
      # The worklet's own install brings Bare, so its test runs the built
      # worklet under it.
      - run: npm ci
        working-directory: mobile/worklet
      - run: npm ci
        working-directory: mobile/app
      - name: Typecheck
        run: |
          npm run typecheck
          npx tsc -p mobile/worklet
          (cd mobile/app && npx tsc --noEmit)
      - run: npm run build
      - name: Tests (library and worklet)
        run: npm test
      - name: Tests (app screens)
        run: npm test
        working-directory: mobile/app

  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/worklet/package-lock.json
            mobile/app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci
        working-directory: mobile/worklet
      - run: npm ci
        working-directory: mobile/app
      # Packs the worklet, links its addons and checks them against the
      # app's Bare (with the runner's NDK), then builds the APK.
      - name: Build the APK
        working-directory: mobile/app
        run: |
          npm run build:bare
          CI=1 npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: pai-android
          path: mobile/app/android/app/build/outputs/apk/release/app-release.apk
